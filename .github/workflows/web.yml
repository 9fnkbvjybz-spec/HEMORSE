name: Validate HerMorse Web
on:
  push:
    paths:
      - web/**
      - netlify.toml
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - netlify.toml
      - .github/workflows/web.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    name: Web - Netlify PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Morse core tests
        run: npm test
      - name: Build offline application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and offline tests
        run: npm run test:e2e
